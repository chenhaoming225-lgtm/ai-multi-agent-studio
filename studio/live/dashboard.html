<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Multi-Agent Studio · 实时看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e8ecf4; overflow: hidden; height: 100vh; }
  #app { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 56px 1fr 220px; height: 100vh; }
  /* 顶栏 */
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: #161d2e; border-bottom: 1px solid #232c42; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  header h1 .dot { color: #4ade80; }
  #status { margin-left: auto; font-size: 13px; color: #93a1c0; }
  #status .live { color: #4ade80; }
  #status .idle { color: #f59e0b; }
  /* 左侧：办公室 */
  #office { position: relative; background: #131a29; overflow: hidden; }
  #office .room-label { position: absolute; font-size: 12px; color: #6b7ba1; letter-spacing: 2px; font-weight: 600; }
  #office .desk { position: absolute; background: rgba(255,255,255,.04); border: 1px solid #2a3452; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: box-shadow .3s, border-color .3s; }
  #office .desk.active { border-color: #4ade80; box-shadow: 0 0 22px rgba(74,222,128,.25); }
  #office .desk.err { border-color: #f87171; box-shadow: 0 0 22px rgba(248,113,113,.25); }
  #office .desk .person { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #1f2937; border: 2px solid #374151; transition: transform .4s; }
  #office .desk.active .person { transform: scale(1.08); border-color: #4ade80; }
  #office .desk .name { font-size: 12px; color: #dbe2f0; font-weight: 600; }
  #office .desk .model { font-size: 10px; color: #6b7ba1; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #office .desk .task { font-size: 10px; color: #4ade80; max-width: 170px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #office .desk .state { font-size: 11px; color: #f59e0b; }
  #office .bubble { position: absolute; background: #1e293b; border: 1px solid #334155; color: #dbe2f0; font-size: 11px; padding: 6px 10px; border-radius: 8px; max-width: 260px; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 10; animation: fadein .2s; }
  #office .bubble::after { content: ""; position: absolute; top: 100%; left: 20px; border: 5px solid transparent; border-top-color: #1e293b; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  /* 右侧：事件流 */
  #events { grid-row: 1 / 3; grid-column: 2; background: #101828; border-left: 1px solid #232c42; display: flex; flex-direction: column; overflow: hidden; }
  #events h2 { font-size: 13px; padding: 12px 16px; border-bottom: 1px solid #1e2740; color: #93a1c0; font-weight: 600; }
  #eventList { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .ev { padding: 7px 10px; margin: 4px 0; border-radius: 7px; font-size: 12px; line-height: 1.5; background: #141c2e; border-left: 3px solid #334155; animation: slidein .25s; }
  @keyframes slidein { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: none; } }
  .ev .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; font-weight: 600; }
  .ev.crew .tag { background: #4338ca; color: #c7d2fe; }
  .ev.task .tag { background: #0369a1; color: #bae6fd; }
  .ev.agent .tag { background: #065f46; color: #a7f3d0; }
  .ev.llm .tag { background: #7c2d12; color: #fed7aa; }
  .ev.done .tag { background: #166534; color: #bbf7d0; }
  .ev.err .tag { background: #991b1b; color: #fecaca; }
  .ev b { color: #f0f4ff; }
  .ev .muted { color: #6b7ba1; }
  /* 底部：日志 */
  #log { grid-column: 1 / 3; grid-row: 3; display: flex; flex-direction: column; background: #0c1220; border-top: 1px solid #1e2740; }
  #log h2 { font-size: 13px; padding: 8px 16px; color: #93a1c0; }
  #logBody { flex: 1; overflow-y: auto; padding: 6px 14px; font-family: Consolas, monospace; font-size: 11px; color: #7f8db0; }
  #logBody .ln { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
  #logBody .ln.llm { color: #fbbf24; }
  #logBody .ln.agent { color: #4ade80; }
  #logBody .ln.err { color: #f87171; }
  /* 状态与成本 */
  #stats { display: flex; gap: 18px; font-size: 12px; color: #93a1c0; }
  #stats b { color: #e8ecf4; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="dot">⬤</span> AI Multi-Agent Studio · 实时看板</h1>
    <div id="stats">
      <span>活跃员工 <b id="stWork">0</b></span>
      <span>完成任务 <b id="stDone">0</b></span>
      <span>LLM 调用 <b id="stLLM">0</b></span>
      <span>Token <b id="stTokens">0</b></span>
    </div>
    <div id="status">连接中… <span class="idle pulse">●</span></div>
  </header>

  <div id="office">
    <!-- 布局：左上 CEO 办公室，中部研发/测试/文档工位 -->
    <div class="room-label" style="top:14px; left:20px;">👑 CEO 办公室</div>
    <div class="room-label" style="top:14px; left:52%;">💻 研发工位</div>
    <div class="room-label" style="top:14px; left:78%;">🧪 测试工位</div>
    <div class="room-label" style="bottom:14px; left:52%;">📄 文档工位</div>
    <!-- 员工卡片由 JS 动态插入 -->
  </div>

  <div id="events">
    <h2>📡 实时事件流</h2>
    <div id="eventList"></div>
  </div>

  <div id="log">
    <h2>📜 运行日志</h2>
    <div id="logBody"></div>
  </div>
</div>

<script>
const DESKS = {
  "ceo": { label: "👑 CEO", pos: { left: "6%", top: "8%" }, size: "16%", h: "26%" },
  "dev": { label: "💻 研发", pos: { left: "50%", top: "5%" }, size: "20%", h: "26%" },
  "qa":  { label: "🧪 测试", pos: { left: "75%", top: "5%" }, size: "20%", h: "26%" },
  "doc": { label: "📄 文档", pos: { left: "50%", top: "62%" }, size: "20%", h: "26%" },
};
const roleToDesk = (role) => {
  const s = role || "";
  if (s.includes("CEO") || s.includes("总指挥") || s.includes("manager") || s.toLowerCase().includes("ceo")) return "ceo";
  if (s.includes("研发") || s.includes("开发") || s.includes("工程师") && !s.includes("测试")) return "dev";
  if (s.includes("测试") || s.includes("QA") || s.toLowerCase().includes("qa")) return "qa";
  if (s.includes("文档") || s.includes("文秘") || s.includes("doc")) return "doc";
  return "dev";
};
const office = document.getElementById("office");
const persons = {}; // role -> {deskEl, taskEl, agentRole}
Object.entries(DESKS).forEach(([key, cfg]) => {
  const el = document.createElement("div");
  el.className = "desk";
  el.style.left = cfg.pos.left; el.style.top = cfg.pos.top;
  el.style.width = cfg.size; el.style.height = cfg.h;
  el.innerHTML = `<div class="person">${cfg.label.split(" ")[1] === "CEO" ? "👑" : cfg.label.split(" ")[1] === "研发" ? "🧑💻" : cfg.label.split(" ")[1] === "测试" ? "🔍" : "📝"}</div>
    <div class="name">${cfg.label.split(" ")[1] || cfg.label}</div>
    <div class="model muted">待命</div>
    <div class="task"></div>
    <div class="state"></div>`;
  office.appendChild(el);
  persons[key] = el;
});
function setDesk(key, model, task, state, active) {
  const el = persons[key]; if (!el) return;
  const modelEl = el.querySelector(".model"), taskEl = el.querySelector(".task"), stateEl = el.querySelector(".state");
  if (model) modelEl.textContent = model;
  if (task !== undefined) taskEl.textContent = task;
  if (state) stateEl.textContent = state;
  el.classList.toggle("active", !!active);
  el.classList.remove("err");
}
// 事件流
const evList = document.getElementById("eventList");
function addEvent(cls, tag, html) {
  const d = document.createElement("div");
  d.className = "ev " + cls;
  d.innerHTML = `<span class="tag">${tag}</span>` + html;
  evList.prepend(d);
  while (evList.children.length > 120) evList.lastChild.remove();
}
// 日志
const logBody = document.getElementById("logBody");
function addLog(cls, text) {
  const d = document.createElement("div");
  d.className = "ln " + cls;
  d.textContent = text;
  logBody.appendChild(d);
  while (logBody.children.length > 400) logBody.firstChild.remove();
  logBody.scrollTop = logBody.scrollHeight;
}
// 统计
let statLLM = 0, statDone = 0, statTokens = 0;
const $ = (id) => document.getElementById(id);
function flashBubble(deskKey, text) {
  const el = persons[deskKey]; if (!el) return;
  const rect = el.getBoundingClientRect();
  const officeRect = office.getBoundingClientRect();
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  b.style.left = (rect.left - officeRect.left + 10) + "px";
  b.style.top = (rect.top - officeRect.top - 34) + "px";
  office.appendChild(b);
  setTimeout(() => b.remove(), 2600);
}
// SSE
const statusEl = document.getElementById("status");
const es = new EventSource("/events");
es.onopen = () => { statusEl.innerHTML = "实时连接 <span class='live'>●</span>"; };
es.onerror = () => { statusEl.innerHTML = "断开 <span class='idle pulse'>●</span>"; };
es.onmessage = (e) => {
  try { const m = JSON.parse(e.data); handle(m); } catch {}
};
function handle(m) {
  const d = m.data || {};
  switch (m.type) {
    case "crew_start":
      addEvent("crew", "公司", "任务启动：<b>" + (d.inputs?.task || "?") + "</b>");
      addLog("", "[公司] 任务启动: " + (d.inputs?.task || ""));
      break;
    case "crew_done":
      addEvent("done", "完成", "公司任务完成，<span class='muted'>token " + (d.tokens ?? 0) + "</span>");
      addLog("", "[公司] 完成 ✅");
      statusEl.innerHTML = "任务完成 <span class='live'>●</span>";
      break;
    case "crew_fail":
      addEvent("err", "失败", d.error || "?");
      addLog("err", "[公司] 失败: " + (d.error || ""));
      break;
    case "task_start":
      addEvent("task", "任务", "<b>" + (d.agent || "?") + "</b>：<span class='muted'>" + (d.description || "") + "</span>");
      addLog("", "[任务] " + (d.description || ""));
      break;
    case "agent_start": {
      const key = roleToDesk(d.role);
      setDesk(key, d.model, d.task, "工作中…", true);
      const s = document.querySelector(`#office .desk ${persons[key] ? "" : ""}`);
      addEvent("agent", "员工", "<b>" + (d.role || "?") + "</b> 开工 <span class='muted'>" + (d.model || "") + "</span>");
      addLog("agent", "[" + (d.role || "?") + "] " + (d.task || ""));
      flashBubble(key, (d.task || "").slice(0, 40));
      $("stWork").textContent = Object.keys(persons).filter(k => persons[k].classList.contains("active")).length;
      break;
    }
    case "agent_done": {
      const key = roleToDesk(d.role);
      setDesk(key, null, "", "✅ 完成", false);
      statDone++;
      $("stDone").textContent = statDone;
      addEvent("done", "交付", "<b>" + (d.role || "?") + "</b> 完成：<span class='muted'>" + (d.output || "").slice(0, 80) + "</span>");
      addLog("agent", "[" + (d.role || "?") + "] ✅ " + (d.output || "").slice(0, 120));
      break;
    }
    case "agent_err": {
      const key = roleToDesk(d.role);
      if (persons[key]) { persons[key].classList.add("err"); setDesk(key, null, "", "❌ 出错", false); }
      addEvent("err", "出错", "<b>" + (d.role || "?") + "</b>：" + (d.error || ""));
      addLog("err", "[" + (d.role || "?") + "] ❌ " + (d.error || ""));
      break;
    }
    case "llm_start":
      statLLM++;
      $("stLLM").textContent = statLLM;
      addEvent("llm", "LLM", "<b>" + (d.model || "?") + "</b> <span class='muted'>调用 #" + statLLM + "</span>");
      addLog("llm", "[LLM] " + (d.model || "?") + ": " + (d.prompt || "").slice(0, 90));
      break;
  }
}
</script>
</body>
</html>
